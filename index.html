<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Vault</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <a class="skip" href="#main">Skip to content</a>

    <aside class="side">
        <p class="brand">Book Vault</p>
        <nav aria-label="Main">
            <button data-view="home">Home</button>
            <button data-view="library">Library</button>
            <button data-view="add">Add</button>
            <button data-view="settings">Settings</button>
        </nav>
    </aside>

    <main id="main">
        <section id="view-home" class="view">
            <h1 id="greet">Hello</h1>
            <div class="stats">
                <div class="stat hot"><b id="stat-pages">0</b><span>pages read</span></div>
                <div class="stat"><b id="stat-books">0</b><span>books</span></div>
                <div class="stat"><b id="stat-authors">0</b><span>authors</span></div>
                <div class="stat"><b id="stat-tag">-</b><span>top tag</span></div>
            </div>
            <p class="goal" id="goal-text"></p>
            <div class="bar"><i id="goal-bar"></i></div>
            <div class="week" id="week" aria-label="Pages added in the last 7 days"></div>
            <div class="latest">
                <p class="label">Last added</p>
                <h2 id="latest"></h2>
            </div>
        </section>

        <section id="view-library" class="view" hidden>
            <h1>Library</h1>
            <label class="label" for="search">Search (regular expression)</label>
            <input id="search" class="search" placeholder="azra|kingdom" autocomplete="off" spellcheck="false">
            <p id="search-status" role="status" class="status"></p>
            <div class="chips">
                <button data-sort="dateAdded" aria-pressed="true">Date</button>
                <button data-sort="title" aria-pressed="false">Title</button>
                <button data-sort="pages" aria-pressed="false">Pages</button>
            </div>
            <table class="books">
                <thead>
                    <tr><th>Book</th><th>Pages</th><th class="hide-sm">Tag</th><th class="hide-sm">Added</th><th><span class="sr-only">Actions</span></th></tr>
                </thead>
                <tbody id="book-rows"></tbody>
            </table>
        </section>

        <section id="view-add" class="view" hidden>
            <h1>New book</h1>
            <form id="add-form" novalidate>
                <div class="field"><label for="title">Title</label><input id="title" name="title" aria-describedby="err-title"><p class="err" id="err-title"></p></div>
                <div class="field"><label for="author">Author</label><input id="author" name="author" aria-describedby="err-author"><p class="err" id="err-author"></p></div>
                <div class="field"><label for="pages">Pages</label><input id="pages" name="pages" inputmode="numeric" aria-describedby="err-pages"><p class="err" id="err-pages"></p></div>
                <div class="field"><label for="tag">Tag</label><input id="tag" name="tag" aria-describedby="err-tag"><p class="err" id="err-tag"></p></div>
                <div class="field"><label for="dateAdded">Date</label><input id="dateAdded" name="dateAdded" placeholder="YYYY-MM-DD" aria-describedby="err-dateAdded"><p class="err" id="err-dateAdded"></p></div>
                    <button class="btn" type="submit">Save book</button>
                    <p id="form-status" role="status" class="status"></p>
            </form>
        </section>

        <section id="view-settings" class="view" hidden>
            <h1>Settings</h1>
            <form id="goal-form" novalidate>
                <label class="label" for="goal-input">Pages goal</label>
                <div class="field"><<input id="goal-input" inputmode="numeric" aria-describedby="goal-error"><button class="btn small" type="submit">Save</button></div>
                <p class="err" id="goal-error"></p>
            </form>
            <div class="button-row">
                <button class="pill" id="export">Export JSON</button>
                <label class="pill">Import JSON<input id="import" type="file" accept="application/json" hidden></label>
                <button class="pill" id="seed">Load sample books</button>
            </div>
            <p id="data-status" role="status" class="status"></p>
        </section>
    </main>

    <nav class="tabbar" aria-label="Main mobile">
        <button data-view="home">Home</button>
        <button data-view="library">Library</button>
        <button data-view="add">Add</button>
        <button data-view="settings">Settings</button>
    </nav>

    <script type="module" src="scripts/app.js"></script>
</body>
</html>
